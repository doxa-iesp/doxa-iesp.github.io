name: Links externos

# Uma vez por mês, confere se os links para fora do site (jornais, revistas, Drive…) ainda abrem.
# Se algum não abrir, abre uma issue "Links quebrados", ou comenta na que já estiver aberta.
# Não bloqueia nada: o deploy não depende disto.
#
# Links internos não passam por aqui; o build já confere todos (scripts/checar-links-internos.mjs).
# Os sites deixados de fora da conferência, e o motivo de cada um, estão em .github/lychee.toml.
#
# O GitHub desliga workflows agendados em repositório sem nenhum commit por 60 dias. Se a
# checagem parar de rodar, reative em Actions > Links externos > "Enable workflow".

on:
  schedule:
    # Dia 1 de cada mês, 9h17 UTC (6h17 em Brasília). Minuto "quebrado" de propósito: na hora
    # cheia a fila de agendamentos do GitHub lota, e a execução atrasa ou é descartada.
    - cron: '17 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: links-externos
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    # Normalmente leva uns 8 minutos; com o Google limitando pedidos, o Drive tenta de novo depois
    # de 2 e de 10 minutos.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Arquivos por padrão, não por pasta: dentro de uma pasta o lychee só lê .md e .html, e pularia
      # os .yaml. As aspas deixam o `**` com o lychee, que desce em qualquer nível de subpasta.
      - name: Links em geral
        id: geral
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .github/lychee.toml --no-progress 'src/data/*.yaml' 'src/content/**/*'
          output: relatorios/geral.md
          fail: false

      # O Drive tem verificador próprio, que separa "o arquivo deixou de ser público" de "o Google
      # limitou os pedidos" e confere de novo o que falhou (o motivo está no cabeçalho do script).
      - name: Links do Google Drive
        id: drive
        if: ${{ !cancelled() }}
        run: node scripts/checar-links-drive.mjs --saida relatorios/drive.md

      - name: Abrir ou atualizar a issue
        if: >-
          ${{ !cancelled() &&
          ((steps.geral.outputs.exit_code != '' && steps.geral.outputs.exit_code != '0') ||
          (steps.drive.outputs.quebrados != '' && steps.drive.outputs.quebrados != '0')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "A checagem mensal encontrou links para fora do site que não abriram."
            echo
            echo "**O que fazer** (com mais detalhe em \"Quando aparece a issue Links quebrados\", no guia de manutenção, \`docs/GUIA_DE_MANUTENCAO.md\`):"
            echo "- **Link do Google Drive:** não troque o link. Se \"deixou de ser público\", peça a quem administra o Drive do DOXA para voltar o compartilhamento a \"Qualquer pessoa com o link\". Se \"não existe mais\", tente restaurar o arquivo da lixeira do Drive, e o link volta a valer."
            echo "- **Qualquer outro link:** abra numa janela anônima. Abriu e mostra o conteúdo certo? É alarme falso (alguns sites recusam robôs): comente aqui, e quem cuida do código tira o site da conferência. Não abriu? Endereço novo, cópia no Wayback Machine ou item sem \`url\`."
            echo
            echo "Feche a issue quando terminar. Execução: $EXECUCAO"
            for relatorio in relatorios/geral.md relatorios/drive.md; do
              if [ -f "$relatorio" ]; then
                printf '\n---\n\n'
                cat "$relatorio"
              fi
            done
          } > corpo.md

          # Issue e comentário aceitam até 65.536 caracteres. Corta em 60.000 bytes sem partir
          # um caractere acentuado ao meio.
          python3 - <<'PY'
          dados = open('corpo.md', 'rb').read()
          texto = dados[:60000].decode('utf-8', 'ignore')
          if len(dados) > 60000:
              texto += '\n\n_(Relatório cortado. O completo está no link da execução, acima.)_\n'
          open('corpo.md', 'w', encoding='utf-8').write(texto)
          PY

          gh label create links-quebrados --color d73a4a \
            --description "Aberta pela checagem mensal de links externos" --force
          numero=$(gh issue list --label links-quebrados --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body-file corpo.md
          else
            gh issue create --title "Links quebrados" --label links-quebrados --body-file corpo.md
          fi
