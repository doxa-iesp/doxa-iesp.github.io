name: Verificação de Pull Request

# Roda em todo pull request. Objetivo: se alguém digitar um valor inválido num
# YAML de conteúdo, o build falha e o PR fica vermelho ANTES do merge — nada
# quebrado silenciosamente chega à produção.
on:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Build e checagem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (determinístico)
        run: npm ci

      - name: Build do Astro (valida os schemas — YAML inválido reprova o PR aqui)
        shell: bash
        # `pipefail` é obrigatório: sem ele o `tee` devolveria 0 e um build quebrado passaria.
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      # A mesma trava do deploy.yml: o loader `file()` do Astro pode sair com código 0 depois
      # de falhar ao ler um YAML, publicando a coleção vazia. Sem isto, o PR ficaria verde.
      - name: Nenhuma coleção pode ter falhado em silêncio
        shell: bash
        run: |
          if grep -q "\[file-loader\] Error" build.log; then
            echo "::error::Uma coleção de dados falhou ao carregar. O site sairia sem esse conteúdo."
            exit 1
          fi

      - name: Publicar dist/ como artefato para o revisor baixar
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: ./dist
          if-no-files-found: error

      - name: Checagem de tipos (astro check)
        # @astrojs/check e typescript estão em devDependencies, então `npm ci` já os
        # instalou. Sem eles, `astro check` sai com código 0 sem checar coisa alguma.
        run: npm run check
