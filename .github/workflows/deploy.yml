name: Deploy do site (Astro) para o GitHub Pages

# Constrói o site com Astro e publica no GitHub Pages a cada push na main.
# Substitui o antigo workflow do Hugo.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo no topo; cada job pede só o que usa (o de build roda `npm ci`, que executa
# scripts de instalação de dependências — ele não precisa poder publicar).
permissions:
  contents: read

# Um deploy por vez; não cancela um deploy já em andamento.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # o configure-pages consulta a API do Pages
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (determinístico)
        run: npm ci

      # `npm run build` = `npm run validar && astro build` (validar = node scripts/validar-dados.mjs).
      # O validador existe porque o loader `file()` do Astro engole erros de YAML e sai com
      # código 0, publicando a coleção vazia. Ver scripts/validar-dados.mjs.
      - name: Build do Astro (valida o conteúdo antes)
        shell: bash
        # `pipefail` é obrigatório: sem ele o `tee` devolveria 0 e um build quebrado passaria.
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      # Cinto e suspensório: qualquer erro de leitura de dados reprova o deploy, mesmo que o
      # Astro insista em sair com código 0.
      #
      # No CI o log sai COLORIDO (a variável CI liga as cores), e o código de cor fica entre
      # o rótulo e a mensagem: `[ERROR] [file-loader]^[[39m Error reading data`. Um grep por
      # "[file-loader] Error" nunca casava. Procurar só o rótulo casa com ou sem cor; num
      # build bom os loaders não escrevem nada no log.
      - name: Nenhuma coleção pode ter falhado em silêncio
        shell: bash
        run: |
          if grep -nE '\[(file|glob)-loader\]' build.log; then
            echo "::error::Uma coleção de dados falhou ao carregar. O site sairia sem esse conteúdo."
            exit 1
          fi

      # Todo link e arquivo interno do site montado precisa existir. Um PDF que não chegou ao
      # commit, ou um link digitado errado, dá 404 com o build verde — é isto que pega.
      - name: Links internos
        run: npm run verificar-links

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # Publicar no Pages via OIDC.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
