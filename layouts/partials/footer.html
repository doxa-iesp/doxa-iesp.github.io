    <div class="footer-logo">
      <a href="{{ .Site.BaseURL }}" aria-label="DOXA — Página inicial">
        <img src="{{ "img/logo-doxa.svg" | relURL }}" alt="DOXA" width="130" height="40">
      </a>
    </div>
    <div class="footer-info">
      <p class="footer-institution">Laboratório de Estudos Eleitorais, de Comunicação Política e Opinião Pública</p>
      <p>Instituto de Estudos Sociais e Políticos (IESP-UERJ)</p>
      <p>{{ .Site.Params.address }}</p>
      <p>{{ .Site.Params.cep }}</p>
      <p><a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a></p>
    </div>
    <div class="footer-social">
      <a href="{{ .Site.Params.youtube }}" target="_blank" rel="noopener noreferrer" aria-label="Canal do DOXA no YouTube">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

    <p class="container">© {{ now.Year }} DOXA — IESP-UERJ. Todos os direitos reservados.</p>
  </div>
