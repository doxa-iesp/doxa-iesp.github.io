<li class="media-item">
  {{ if .url }}
  <a href="{{ .url }}" target="_blank" rel="noopener noreferrer" class="media-title">{{ .title }}</a>
  {{ else }}
  <span class="media-title">{{ .title }}</span>
  {{ end }}
  <span class="media-meta">
    {{ with .authors }}{{ . }}. {{ end }}<em>{{ .outlet }}</em>{{ with .date }}, {{ dateFormat "02/01/2006" (time .) }}{{ end }}.
  </span>
</li>
