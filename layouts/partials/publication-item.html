<li class="publication-item">
  {{ if .url }}
  <a href="{{ .url }}" target="_blank" rel="noopener noreferrer" class="publication-title">{{ .title }}</a>
  {{ else }}
  <span class="publication-title">{{ .title }}</span>
  {{ end }}
  <p class="publication-meta">
    {{ .authors }} {{ with .year }}({{ . }}){{ end }}{{ with .publisher }}. {{ . }}{{ end }}{{ with .journal }}. <em>{{ . }}</em>{{ end }}{{ with .pages }}, {{ . }}{{ end }}.
  </p>
</li>
