<div class="team-card">
  <div class="team-card-photo">
    {{ if .photo }}
    <img src="{{ strings.TrimPrefix "/" .photo | relURL }}" alt="{{ .name }}" loading="lazy">
    {{ else }}
    <div class="team-card-placeholder" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
    </div>
    {{ end }}
  </div>
  <div class="team-card-info">
    <h3 class="team-card-name">{{ .name }}</h3>
    {{ with .role }}<p class="team-card-role">{{ . }}</p>{{ end }}
    {{ with .bio }}<p class="team-card-bio">{{ . }}</p>{{ end }}
    {{ if or .lattes .email }}
    <div class="team-card-links">
      {{ with .lattes }}<a href="{{ . }}" target="_blank" rel="noopener noreferrer" class="team-card-link" title="Currículo Lattes">Lattes</a>{{ end }}
      {{ with .email }}<a href="mailto:{{ . }}" class="team-card-link" title="E-mail">E-mail</a>{{ end }}
    </div>
    {{ end }}
  </div>
</div>
