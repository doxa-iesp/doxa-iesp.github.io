<article class="event-card">
  {{ if .image }}
  <div class="event-card-image">
    <img src="{{ .image }}" alt="{{ .title }}" loading="lazy">
  </div>
  {{ end }}
  <div class="event-card-content">
    <time class="event-card-date" datetime="{{ .date }}">{{ dateFormat "02/01/2006" (time .date) }}</time>
    <h3 class="event-card-title">{{ .title }}</h3>
    {{ with .description }}<p class="event-card-desc">{{ . }}</p>{{ end }}
    {{ with .url }}<a href="{{ . }}" class="event-card-link" target="_blank" rel="noopener noreferrer">Saiba mais</a>{{ end }}
  </div>
</article>
