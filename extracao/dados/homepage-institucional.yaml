votaai:
  title: "Vota aí – Conectando você a propostas eleitorais"
  description: "O projeto idealizado por Nara Salles foi desenvolvido pelo Doxa durante as eleições municipais de 2020. A edição referente às eleições municipais deste ano, lançada em 26/08/2024, é coordenada por Nara Salles e Argelina Figueiredo em uma parceria entre o Doxa (Iesp-Uerj) e o Cesop (Unicamp). Estão disponíveis todos os programas de governo registrados por candidatas e candidatos às prefeituras de todos os municípios do Brasil desde 2012. Utilizando a inteligência artificial, a plataforma oferece diferentes ferramentas para consultar as propostas de governo. Depois das eleições, o projeto não acaba. O Vota Aí! continua disponível para que as eleitoras e os eleitores busquem os documentos sempre que desejar, e acompanhem se o que foi proposto na sua cidade está sendo realizado."
  url: "https://www.votaai.cesop.unicamp.br/"

