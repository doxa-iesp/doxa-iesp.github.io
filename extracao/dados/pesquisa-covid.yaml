projeto:
  titulo: 'COVID no Estado do Rio de Janeiro: Monitoramento e Efeitos'
  titulo_projeto: Monitoramento e previsão de impacto das medidas de enfrentamento da epidemia no Estado do Rio de Janeiro
  objetivo: O projeto tem como objetivo geral monitorar e analisar as medidas de combate à Covid no Estado do Rio de Janeiro e avaliar as respostas da população e seus efeitos socioeconômico e políticos. Para tanto, analisa a atuação dos prefeitos no enfrentamento da Covid no Estado, principalmente as medidas de restrição e flexibilização da quarentena tomadas, seus efeitos em grupos mais vulneráveis. O projeto inclui uma ampla pesquisa da bibliografia publicada no exterior e no Brasil segundo temas selecionados.
  financiamento: FAPERJ, AÇÃO EMERGENCIAL COVID-19/SARS-CoV-2 FAPERJ/SES
  url: https://www.lab-doxa.org.br/pesquisa-covid/
