  - title: "Workshop: Geografia Eleitoral e Áreas de Leitura Comparáveis"
    date: "2026-05-29"
    description: "Workshop sobre o desenvolvimento de unidades geográficas intramunicipais longitudinalmente comparáveis, com apresentações de Lucas Gelape (Fafich-UFMG), Glauco Peres (FFLCH-USP), Thiago M. Q. Moreira (Louisiana State University) e Fernando Guarnieri (IESP-UERJ), e debate de Argelina Cheibub Figueiredo (IESP-UERJ), George Avelino (EAESP-FGV) e Lara Mesquita (EESP-FGV). Moderação de Bruno Marques Schaefer e Fernando Meireles. Sala Olavo Brasil, IESP-UERJ, das 14h às 17h. Organização do Departamento de Estudos Políticos do IESP-UERJ, do DOXA e do Cepesp-FGV."
    image: "https://iesp.uerj.br/wp-content/uploads/2026/05/GeoEleitoral-redes-1.png"
    url: "https://iesp.uerj.br/evento/workshop-geografia-eleitoral-e-areas-de-leitura-comparaveis/"

  - title: "Edição digital gratuita do livro “A Decisão do Voto” de Marcus Figueiredo"
    date: "2022-12-16"
    description: "O Doxa está publicando uma edição digital gratuita do livro “A Decisão do Voto” de Marcus Figueiredo. Escaneie o QR CODE na imagem, ou clique no link abaixo e garanta seu livro gratuitamente. Clique aqui para baixar o livro"
    image: "https://www.lab-doxa.org.br/wp-content/uploads/2022/12/FIGUEIREDO_A-DECISAO-DO-VOTO_CARTAZ-scaled.jpg"
    url: "https://www.lab-doxa.org.br/edicao-digital-gratuita-do-livro-a-decisao-do-voto-de-marcus-figueiredo/"
    # O PDF agora é servido pelo próprio site (era um Google Doc de terceiro).
    attachments:
      - "/pdfs/livros/a-decisao-do-voto-marcus-figueiredo.pdf"

  - title: "Seminário comemora 25 anos do Doxa"
    date: "2022-11-11"
    description: "No dia 25 de novembro de 2021, o Doxa celebrou seus 25 anos com um seminário online sobre sua origem e legado, além de traçar um panorama sobre temas centrais para a democracia brasileira nos tempos atuais. Palestrantes: Fernando Limongi (USP/FGV), Patrícia Campos Mello (Folha de S. Paulo), Luciana Veiga (Unirio/ABCP) e Felipe Borba (Unirio)."
    image: "https://www.lab-doxa.org.br/wp-content/uploads/2022/08/Seminario-25-anos-DOXA.jpg"
    url: "https://www.lab-doxa.org.br/seminario-comemora-25-anos-do-doxa/"

  - title: "DOXA 20 anos, o legado de Marcus Figueiredo"
    date: "2017-11-11"
    description: "13 de novembro 14h – Abertura Palestrantes:Fernando Azevedo – UFSCarAfonso Albuquerque – UFF Lançamento do livro: Eleições, Opinião Pública e Comunicação Política no Brasil Contemporâneo Organizadores: Felipe Borba e Alessandra Aldé 17h – Coquetel Instituto de Estudos Sociais e Políticos da UERJ – IESP/UERJRua da Matriz, 82 – Botafogo"
    image: "https://www.lab-doxa.org.br/wp-content/uploads/2022/11/Doxa_20_parae-mail_azul.jpg"
    url: "https://www.lab-doxa.org.br/doxa-20-anos-o-legado-de-marcus-figueiredo/"

  - title: "Seminário Marcus Figueiredo: Eleições, Opinião Pública e Comunicação Política no Brasil Contemporâneo"
