- nome: Programas eleitorais dos Candidatos a Prefeito do Estado do Rio de Janeiro
  descricao: Tabela com até 5 propostas de cada candidato a prefeito do Estado do Rio de Janeiro.
  cobertura: 92 municípios do Estado do Rio de Janeiro; eleições municipais de 2020; 577 candidatos a
    prefeito (539 com programa disponível, 38 sem programa). 627 arquivos de proposta (572 PDF + 55 imagens)
    hospedados no TSE (divulgacandcontas.tse.jus.br).
  registros: 577
  arquivos:
  - rotulo: Baixar os dados (CSV)
    url: /dados/programas-eleitorais-rj.csv
  ordem: 1
- nome: Programas eleitorais dos Candidatos a prefeito das Capitais – 2020
  descricao: Tabela com até 5 propostas de cada candidato a prefeito das capitais do país.
  cobertura: 20 capitais e grandes cidades; eleições municipais de 2020; 244 candidatos a prefeito; até
    5 propostas transcritas por candidato.
  registros: 244
  arquivos:
