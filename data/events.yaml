- title: "Edição digital gratuita do livro \"A Decisão do Voto\" de Marcus Figueiredo"
  date: "2022-12-16"
  description: >
    O DOXA disponibiliza gratuitamente a edição digital do livro "A Decisão do Voto"
    de Marcus Figueiredo, fundador do laboratório.
